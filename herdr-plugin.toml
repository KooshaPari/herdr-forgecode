# Herdr plugin manifest for the stock ForgeCode CLI.
#
# Schema is the Herdr v1 plugin manifest. Both the leonardoacosta.herdr-jcode
# (top-level `plugin.*` + `[platforms]` style) and the capt-marbles.jcode-integration
# (`[actions]` table style) shapes are accepted; this file keeps all three so it
# works against the most permissive Herdr plugin loader.
#
# No fork of ForgeCode is required. The plugin wraps the stock `forge` binary.

[plugin]
name        = "herdr-forgecode"
version     = "0.1.0"
author      = "KooshaPari"
description = "Herdr presence/lifecycle for the stock ForgeCode CLI. Reports pane state to the Herdr daemon via pane.report_agent; never recompiles or modifies the upstream binary."
license     = "MIT"
homepage    = "https://github.com/KooshaPari/herdr-forgecode"
repository  = "https://github.com/KooshaPari/herdr-forgecode"
entrypoint  = "bin/herdr-forgecode-report"

[platforms.macos]
entrypoint = "bin/herdr-forgecode-report"
binary     = "forge"

[platforms.linux]
entrypoint = "bin/herdr-forgecode-report"
binary     = "forge"

[platforms.windows]
entrypoint = "bin/herdr-forgecode-report"
binary     = "forge.exe"

[actions.session_start]
command = ["sh", "bin/herdr-forgecode-report", "session_start"]

[actions.turn_end]
command = ["sh", "bin/herdr-forgecode-report", "turn_end"]

[actions.error]
command = ["sh", "bin/herdr-forgecode-report", "error"]

[actions.session_end]
command = ["sh", "bin/herdr-forgecode-report", "session_end"]

[actions.report]
command = ["sh", "bin/herdr-forgecode-report", "report"]

[actions.wrapper]
command = ["sh", "bin/herdr-forgecode-report", "forge"]
